<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>WezographVPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f;
    --txt:#e7e9ee; --mut:#8b93a7; --acc:#5b8cff; --ok:#3ddc84;
  }
  [data-theme="light"]{
    --bg:#f4f5f7; --card:#ffffff; --card2:#eceef2;
    --txt:#14161a; --mut:#6b7385; --acc:#3a6ff0;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{background:var(--bg);color:var(--txt);padding:16px 14px 90px;min-height:100vh}
  .hero{background:linear-gradient(135deg,#2b3a6b,#5b8cff);border-radius:20px;padding:20px;margin-bottom:18px;
        box-shadow:0 8px 24px rgba(91,140,255,.25)}
  .hero h1{font-size:22px;font-weight:700}
  .hero p{opacity:.85;font-size:13px;margin-top:6px}
  .badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:11px;margin-top:10px}
  h2{font-size:15px;margin:18px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;
        border:1px solid rgba(255,255,255,.06);transition:.2s}
  .card:active{transform:scale(.985)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .name{font-size:16px;font-weight:700}
  .price{font-size:16px;font-weight:800;color:var(--acc);white-space:nowrap}
  .desc{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5}
  .feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .feat{background:var(--card2);font-size:11px;padding:5px 9px;border-radius:8px;color:var(--mut)}
  .btn{position:fixed;left:14px;right:14px;bottom:14px;background:var(--acc);color:#fff;border:none;
       border-radius:16px;padding:16px;font-size:16px;font-weight:700;width:calc(100% - 28px);cursor:pointer}
  .btn:disabled{opacity:.4}
  .buy{width:100%;margin-top:14px;background:var(--acc);color:#fff;border:none;border-radius:12px;
       padding:12px;font-size:14px;font-weight:700;cursor:pointer}
  .empty{text-align:center;padding:50px 20px;color:var(--mut)}
  .empty div{font-size:44px;margin-bottom:12px}
  .note{font-size:11px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>

<div class="hero">
  <h1>WezographVPN</h1>
  <p id="hello">Подписки на лучшие VPN-сервисы</p>
  <span class="badge" id="prov">AliusVPN</span>
</div>

<h2 id="listTitle">Доступные тарифы</h2>
<div id="list"></div>

<p class="note">⚠️ Оплата и выдача ключа — только через бота.<br>Администратор напишет вам первым.</p>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
tg.setHeaderColor('#0f1115'); tg.setBackgroundColor('#0f1115');
if (tg.colorScheme === 'light'){
  document.body.dataset.theme = 'light';
  tg.setHeaderColor('#f4f5f7'); tg.setBackgroundColor('#f4f5f7');
}
const u = tg.initDataUnsafe?.user;
if (u) document.getElementById('hello').textContent = `Привет, ${u.first_name}! 👋`;

// --- Получаем тарифы из URL (бот их подставляет) ---
const q = new URLSearchParams(location.search);
const prov = q.get('p') || 'AliusVPN';
document.getElementById('prov').textContent = prov;

let tariffs = [];
try {
  tariffs = JSON.parse(decodeURIComponent(escape(atob((q.get('t')||'').replace(/-/g,'+').replace(/_/g,'/')))));
} catch(e){ tariffs = []; }

const list = document.getElementById('list');
if (!tariffs.length){
  list.innerHTML = `<div class="empty"><div>📭</div>Тарифы временно отсутствуют.<br>Напишите в поддержку бота.</div>`;
} else {
  list.innerHTML = tariffs.map((t,i)=>`
    <div class="card">
      <div class="top">
        <div class="name">${t.name}</div>
        <div class="price">${t.price}</div>
      </div>
      <div class="desc">${t.desc || ''}</div>
      <div class="feats">
        <span class="feat">🌍 Все страны</span>
        <span class="feat">⚡ Без лимитов</span>
        <span class="feat">📱 Все устройства</span>
      </div>
      <button class="buy" onclick="buy(${t.id}, ${i})">🛒 Купить</button>
    </div>`).join('');
}

function buy(id, i){
  const t = tariffs[i];
  tg.showPopup({
    title: t.name,
    message: `Стоимость: ${t.price}\n\nПосле подтверждения администратор свяжется с вами в боте для оплаты и выдачи ключа.`,
    buttons: [
      { type:'cancel', id:'no' },
      { type:'ok', id:'yes', text:'Подтвердить' }
    ]
  }, (btn) => {
    if (btn === 'yes'){
      tg.HapticFeedback.impactOccurred('medium');
      // Отправляем в бота ТОЛЬКО id — цену бот возьмёт из своей БД
      tg.sendData(JSON.stringify({ action:'buy', id:id, prov:prov }));
      setTimeout(()=>{
        document.querySelector('.buy').textContent = '✅ Заявка отправлена';
        tg.close();
      }, 300);
    }
  });
}
</script>
</body>
</html>
